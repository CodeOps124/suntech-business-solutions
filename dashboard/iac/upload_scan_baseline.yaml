AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Suntech P&L Invoice Analytics — secure upload path + data-layer baseline.
  Covers the file-upload security requirement in PROJECT_OVERVIEW.md: any Excel/CSV bulk
  upload must be malware-scanned (GuardDuty Malware Protection for S3) and have
  macros stripped BEFORE parsing. Also pins encryption (KMS) and access logging.
  This is separate from the live TCA upload path — it serves only manual data
  loads feeding the reporting replica during onboarding/backfill, if any.
  Region MUST be me-central-1 (UAE/Dubai).

Parameters:
  ProjectName:
    Type: String
    Default: suntech-pnl
  SecurityAlertTopicArn:
    Type: String
    Description: SNS topic for security findings (reuse the refresh AlertTopic).

Resources:

  # KMS key for envelope encryption at rest (PROJECT_OVERVIEW.md C8 / "always owns").
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ProjectName} reporting data encryption key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountRoot
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-data"
      TargetKeyId: !Ref DataKey

  # Access-log bucket (server access logs for the upload bucket).
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-access-logs-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref DataKey}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  # Quarantine bucket: scanned-clean uploads are moved here for the ETL to read.
  CleanBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-uploads-clean-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref DataKey}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  # Landing bucket: all uploads land here and are scanned by GuardDuty before use.
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-uploads-landing-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref DataKey}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: upload-access/
      NotificationConfiguration:
        EventBridgeConfiguration: {EventBridgeEnabled: true}

  # GuardDuty Malware Protection plan for the landing bucket. On a CLEAN result,
  # downstream automation (Lambda, not shown) strips macros and copies to
  # CleanBucket; on THREATS_FOUND it deletes/quarantines and alerts.
  MalwareProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: malware-protection-plan.guardduty.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gd-malware-scan
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:ListBucket,
                         s3:GetBucketLocation, s3:PutObjectTagging,
                         s3:GetObjectTagging]
                Resource:
                  - !GetAtt UploadBucket.Arn
                  - !Sub "${UploadBucket.Arn}/*"
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !GetAtt DataKey.Arn

  MalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Properties:
      Role: !GetAtt MalwareProtectionRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref UploadBucket
      Actions:
        Tagging: {Status: ENABLED}   # tags objects with scan result

  # Alert on any malware finding.
  MalwareFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-malware-found"
      EventPattern:
        source: ["aws.guardduty"]
        detail-type: ["GuardDuty Malware Protection Object Scan Result"]
        detail:
          scanResultDetails:
            scanResultStatus: ["THREATS_FOUND"]
      Targets:
        - Id: notify
          Arn: !Ref SecurityAlertTopicArn

Outputs:
  UploadBucketName: {Value: !Ref UploadBucket}
  CleanBucketName:  {Value: !Ref CleanBucket}
  DataKeyArn:       {Value: !GetAtt DataKey.Arn}
